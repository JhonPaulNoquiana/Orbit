services:
  - type: web
    name: orbit-web
    runtime: static
    buildCommand: npm ci --prefix frontend --include=dev && npm --prefix frontend run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: orbit-app
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend --include=dev && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: orbit-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: orbit-db
    region: singapore
    plan: free
    databaseName: orbit
    user: orbit_user
    postgresMajorVersion: "17"
